name: Test server and web shell
on:
  pull_request:
  # The push trigger on main still runs this workflow standalone, and
  # publish-ghcr.yml also calls it, so a push to main runs the tests twice.
  # This is accepted (CI cost only) to keep standalone PR/main status checks.
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: test-results/
