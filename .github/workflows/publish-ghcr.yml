name: Publish Docker image to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize updates to each repository's moving channel tag.
concurrency:
  group: publish-arrview-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-push:
    # Never publish from forks. Dev can explicitly publish a feature branch via
    # Run workflow; release publication is restricted to main and v* tags.
    if: >-
      (github.repository == 'tvstuffs/Arrview-Dev' &&
       (github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')))) ||
      (github.repository == 'tvstuffs/ArrView' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tvstuffs/arrview
          # Only the explicit release-main rule below may generate latest.
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.repository == 'tvstuffs/Arrview-Dev' }}
            type=raw,value=latest,enable=${{ github.repository == 'tvstuffs/ArrView' && github.ref == 'refs/heads/main' }}
            type=ref,event=tag,enable=${{ github.repository == 'tvstuffs/ArrView' }}
            type=sha,format=long,prefix=${{ github.repository == 'tvstuffs/Arrview-Dev' && 'dev-sha-' || 'release-sha-' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
