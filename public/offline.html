<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
  <title>ArrView — Offline</title>
  <link rel="stylesheet" href="/offline.css">
  <script src="/offline.js" defer></script>
</head>
<body>
  <main>
    <img src="/arrview-icon-192.png" width="72" height="72" alt="">
    <h1>Can’t reach your ArrView server</h1>
    <p>Check your connection and that the server is running. Media and downloads aren’t available offline.</p>
    <button id="retry" type="button">Try again</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
