services:
  arrview:
    image: ghcr.io/tvstuffs/arrview:${ARRVIEW_TAG:-latest}
    container_name: arrview
    restart: unless-stopped
    # Host networking lets the container's Bonjour/mDNS advertisement reach the
    # LAN, so the iOS app can auto-discover this server. mDNS is multicast and
    # is NOT forwarded by published ports, so bridge networking breaks discovery.
    # Linux hosts only; the container binds host port 7777 directly (PORT below).
    # Don't need iOS auto-discovery? Drop `network_mode: host` and instead add:
    #   ports:
    #     - "7777:7777"
    network_mode: host
    # Stable mDNS name: without this, os.hostname() is the random container ID and
    # the server advertises e.g. `dd26e00d366b.local`. With it, it's `arrview.local`.
    hostname: arrview
    environment:
      PORT: 7777
      CONFIG_DIR: /data
      # Optional: seed services from Docker instead of the Settings page.
      # A service is locked (read-only in Settings) only when it has BOTH an
      # API key and an address. Values are applied on every read and are never
      # written to config.json. Change them here, then recreate the container:
      #   docker compose up -d      (no image rebuild is needed)
      # Host networking means use `localhost` or the host's address, not
      # compose service names.
      # ARRVIEW_HOST: localhost                  # or <docker-host-address>; no port/path
      # ARRVIEW_SONARR_API_KEY: <your-sonarr-api-key>
      # ARRVIEW_RADARR_API_KEY_FILE: /run/secrets/radarr_api_key
      # ARRVIEW_SABNZBD_API_KEY: <your-sabnzbd-api-key>
      # ARRVIEW_NZBHYDRA_API_KEY: <your-nzbhydra-api-key>
      # ARRVIEW_SONARR_URL: http://<docker-host-address>:8989   # per-service override
      # Optional password login (off by default; see "Password login" in the README):
      # ARRVIEW_PASSWORD: <your-password>                       # visible in `docker inspect`; prefer the file form
      # ARRVIEW_PASSWORD_FILE: /run/secrets/arrview_password    # bind-mount ./secrets/arrview_password
      # ARRVIEW_AUTH: "off"                                     # recovery switch: turns the login off
      # ARRVIEW_TRUSTED_PROXIES: 192.0.2.10, 198.51.100.0/24    # reverse proxies whose X-Forwarded-* is believed
    volumes:
      - ./data:/data
      # For *_API_KEY_FILE secrets (keep ./secrets out of git):
      # - ./secrets/radarr_api_key:/run/secrets/radarr_api_key:ro
